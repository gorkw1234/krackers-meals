const fbApp = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = "app-data";

const store = {
  async get(key) {
    try {
      const doc = await db.collection(COLLECTION).doc(key).get();
      return doc.exists ? doc.data().value : null;
    } catch (e) { console.error("Store get error:", e); return null; }
  },
  async set(key, val) {
    try {
      await db.collection(COLLECTION).doc(key).set({ value: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    } catch (e) { console.error("Store set error:", e); }
  },
  async del(key) {
    try {
      await db.collection(COLLECTION).doc(key).delete();
    } catch (e) { console.error("Store del error:", e); }
  },
  // Real-time listener for syncing across devices
  onSnapshot(key, callback) {
    return db.collection(COLLECTION).doc(key).onSnapshot(doc => {
      if (doc.exists) callback(doc.data().value);
    });
  }
};

  const n = name.toLowerCase();
  for (const [aisle, keywords] of Object.entries(AISLE_KEYWORDS)) {

// MAIN APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [tab, setTab] = useState("recipes");
  const [recipes, setRecipes] = useState([]);
  const [mealPlan, setMealPlan] = useState({});
  const [dayOff, setDayOff] = useState({});
  const [dayServings, setDayServings] = useState({});
  const [extraItems, setExtraItems] = useState([]);
  const [checkedItems, setCheckedItems] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [apiKey, setApiKey] = useState("");

  // Load from storage + set up real-time sync listeners
  useEffect(() => {
    (async () => {
      const r = await store.get("recipes-db");
      const m = await store.get("meal-plan");
      const e = await store.get("extra-items");
      const c = await store.get("checked-items");
      const dOff = await store.get("day-off");
      const dSrv = await store.get("day-servings");
      if (r && r.length > 0) {
        const existingIds = new Set(r.map(x => x.id));
        const missing = STARTER_RECIPES.filter(s => !existingIds.has(s.id));
        if (missing.length > 0) {
          const merged = [...r, ...missing];
          setRecipes(merged);
          store.set("recipes-db", merged);
        } else {
          setRecipes(r);
        }
      }
      else { setRecipes(STARTER_RECIPES); store.set("recipes-db", STARTER_RECIPES); }
      if (m) setMealPlan(m);
      if (e) setExtraItems(e);
      if (c) setCheckedItems(c);
      if (dOff) setDayOff(dOff);
      if (dSrv) setDayServings(dSrv);
      const savedKey = await store.get("api-key");
      if (savedKey) setApiKey(savedKey);
      setLoaded(true);
    })();

    // Real-time sync: listen for changes from other devices
    const unsubs = [
      store.onSnapshot("recipes-db", (val) => { if (val) setRecipes(val); }),
      store.onSnapshot("meal-plan", (val) => { if (val) setMealPlan(val); }),
      store.onSnapshot("extra-items", (val) => { if (val) setExtraItems(val); }),
      store.onSnapshot("checked-items", (val) => { if (val) setCheckedItems(val); }),
      store.onSnapshot("day-off", (val) => { if (val) setDayOff(val); }),
      store.onSnapshot("day-servings", (val) => { if (val) setDayServings(val); }),
    ];
    return () => unsubs.forEach(u => u && u());
  }, []);

  // Save helpers
  const saveRecipes = useCallback((r) => { setRecipes(r); store.set("recipes-db", r); }, []);
  const saveMealPlan = useCallback((m) => { setMealPlan(m); store.set("meal-plan", m); }, []);
  const saveDayOff = useCallback((d) => { setDayOff(d); store.set("day-off", d); }, []);
  const saveDayServings = useCallback((d) => { setDayServings(d); store.set("day-servings", d); }, []);
  const saveExtraItems = useCallback((e) => { setExtraItems(e); store.set("extra-items", e); }, []);
  const saveCheckedItems = useCallback((c) => { setCheckedItems(c); store.set("checked-items", c); }, []);

  if (!loaded) return <div style={{ display: "flex", justifyContent: "center", alignItems: "center", height: "100vh", fontFamily: "'Playfair Display', serif", fontSize: 24, color: "#C4654A" }}><style>{css}</style>Loading your kitchen...</div>;

  const saveApiKey = (key) => { setApiKey(key); store.set("api-key", key); };

  return (
    <div className="app-wrap">
      <style>{css}</style>
      <nav className="nav-bar">
        <h1>🍽 Mise en Place</h1>
        {["recipes", "planner", "shopping"].map(t => (
          <button key={t} className={`nav-btn ${tab === t ? "active" : ""}`} onClick={() => setTab(t)}>
            {t === "recipes" ? "📖 Recipes" : t === "planner" ? "📅 Meal Plan" : "🛒 Shopping"}
          </button>
        ))}
        <button className={`nav-btn ${tab === "settings" ? "active" : ""}`} onClick={() => setTab("settings")}>⚙️</button>
      </nav>
      <div className="main">
        {tab === "recipes" && <RecipesTab recipes={recipes} saveRecipes={saveRecipes} mealPlan={mealPlan} saveMealPlan={saveMealPlan} apiKey={apiKey} />}
        {tab === "planner" && <PlannerTab recipes={recipes} mealPlan={mealPlan} saveMealPlan={saveMealPlan} dayOff={dayOff} saveDayOff={saveDayOff} dayServings={dayServings} saveDayServings={saveDayServings} />}
        {tab === "shopping" && <ShoppingTab recipes={recipes} mealPlan={mealPlan} dayOff={dayOff} dayServings={dayServings} extraItems={extraItems} saveExtraItems={saveExtraItems} checkedItems={checkedItems} saveCheckedItems={saveCheckedItems} />}
        {tab === "settings" && (
          <div className="fade-in">
            <h2 style={{ fontSize: 24, marginBottom: 16 }}>Settings</h2>
            <div className="card" style={{ maxWidth: 500 }}>
              <h3 style={{ fontSize: 16, marginBottom: 8 }}>🔑 Anthropic API Key</h3>
              <p style={{ fontSize: 13, color: "#8B7355", marginBottom: 12 }}>Required for AI recipe suggestions and photo scanning. Get your key from <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style={{ color: "var(--terracotta)" }}>console.anthropic.com</a></p>
              <input
                className="input"
                type="password"
                value={apiKey}
                onChange={e => saveApiKey(e.target.value)}
                placeholder="sk-ant-..."
                style={{ marginBottom: 8 }}
              />
              <p style={{ fontSize: 12, color: apiKey ? "var(--forest)" : "#aaa" }}>{apiKey ? "✓ API key saved" : "No API key set — AI features will not work"}</p>
            </div>
            <div className="card" style={{ maxWidth: 500, marginTop: 12 }}>
              <h3 style={{ fontSize: 16, marginBottom: 8 }}>📊 Data</h3>
              <p style={{ fontSize: 13, color: "#8B7355", marginBottom: 12 }}>Your recipes, meal plans and shopping lists are saved in your browser's local storage.</p>
              <p style={{ fontSize: 13, marginBottom: 8 }}>{recipes.length} recipes saved</p>
              <button className="btn btn-outline btn-sm" onClick={() => {
                const data = { recipes, mealPlan, dayOff, dayServings, extraItems };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a"); a.href = url; a.download = "mise-en-place-backup.json"; a.click();
                URL.revokeObjectURL(url);
              }}>💾 Export Backup</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// RECIPES TAB
// ═══════════════════════════════════════════════════════════════
function RecipesTab({ recipes, saveRecipes, mealPlan, saveMealPlan, apiKey }) {
  const [search, setSearch] = useState("");
  const [filterCuisine, setFilterCuisine] = useState("");
  const [filterDiff, setFilterDiff] = useState("");
  const [filterMealTag, setFilterMealTag] = useState("");
  const [filterTime, setFilterTime] = useState("");
  const [editing, setEditing] = useState(null); // recipe obj or null
  const [viewing, setViewing] = useState(null);
  const [aiPrompt, setAiPrompt] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiOptions, setAiOptions] = useState(null); // array of 3 recipe options from text AI
  const [editMode, setEditMode] = useState(false);
  const [photoLoading, setPhotoLoading] = useState(false);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [photoName, setPhotoName] = useState("");
  const [photoSource, setPhotoSource] = useState("");
  const [pendingDeleteId, setPendingDeleteId] = useState(null);
  const photoInputRef = useRef(null);
  const photoLibRef = useRef(null);

  const filtered = recipes.filter(r => {
    if (search && !r.name.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterCuisine && r.cuisine !== filterCuisine) return false;
    if (filterDiff && r.difficulty !== filterDiff) return false;
    if (filterMealTag && r.mealTag !== filterMealTag) return false;
    if (filterTime) {
      const total = (r.prepTime || 0) + (r.cookTime || 0);
      if (filterTime === "15" && total > 15) return false;
      if (filterTime === "30" && total > 30) return false;
      if (filterTime === "45" && total > 45) return false;
      if (filterTime === "60" && total > 60) return false;
      if (filterTime === "60+" && total <= 60) return false;
    }
    return true;
  });

  const handleDelete = (id) => {
    const updated = recipes.filter(r => r.id !== id);
    saveRecipes(updated);
  };
  const handleSave = (recipe) => {
    const idx = recipes.findIndex(r => r.id === recipe.id);
    if (idx >= 0) { const copy = [...recipes]; copy[idx] = recipe; saveRecipes(copy); }
    else saveRecipes([...recipes, recipe]);
    setEditing(null);
  };

  // AI recipe generation — 3 options
  const generateRecipe = async () => {
    if (!aiPrompt.trim()) return;
    if (!apiKey) { alert("Please add your Anthropic API key in Settings (⚙️) to use AI features."); return; }
    setAiLoading(true);
    setAiResult(null);
    setAiOptions(null);
    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 4000,
          system: "You are a recipe generator. You respond ONLY with valid JSON, no markdown, no backticks, no explanation. All measurements must be metric (g, kg, ml, l). Small amounts can use tsp/tbsp. Convert cups to ml, oz to g, lb to g. Temperatures in celsius.",
          messages: [{ role: "user", content: `Give me 3 different recipe options for: "${aiPrompt}". Each should be a distinct variation (e.g. different cuisines, cooking methods, or flavour profiles). Return a JSON array of 3 recipes: [{"name":"...","mealTag":"Dinner|Breakfast|Meal Prep|Snack|Bakery","cuisine":"Italian|Mexican|Asian|Indian|American|Mediterranean|French|Thai|Japanese|Other","difficulty":"Easy|Medium|Hard","prepTime":number,"cookTime":number,"servings":number,"ingredients":[{"name":"...","qty":number,"unit":"g|kg|ml|l|tsp|tbsp|piece|pinch|clove|can|bunch|slice|"}],"steps":["...","..."]},...]` }],
        }),
      });
      const data = await resp.json();
      if (data.error) {
        console.error("API error:", data.error);
        alert("AI generation failed: " + (data.error.message || "Unknown error"));
        setAiLoading(false);
        return;
      }
      const text = (data.content || []).map(i => i.text || "").join("");
      if (!text) { alert("No response from AI. Please try again."); setAiLoading(false); return; }
      const clean = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      const options = (Array.isArray(parsed) ? parsed : [parsed]).map(r => ({
        ...r,
        id: uid(),
        source: "AI Recipe Suggestion",
        ingredients: (r.ingredients || []).map(i => ({ ...i, id: uid() })),
      }));
      setAiOptions(options);
    } catch (e) {
      console.error("Generate error:", e);
      alert("AI generation failed. Please try again.");
    }
    setAiLoading(false);
  };

  const selectAiOption = (option) => {
    setAiResult(option);
  };

  const saveAiRecipe = () => {
    if (!aiResult) return;
    const toSave = { ...aiResult };
    if (photoName.trim()) toSave.name = photoName.trim();
    if (photoSource.trim()) toSave.source = photoSource.trim();
    const updated = [...recipes, toSave];
    saveRecipes(updated);
    // If we came from AI options, go back to the picker (minus the saved one)
    if (aiOptions) {
      const remaining = aiOptions.filter(o => o.id !== aiResult.id);
      setAiResult(null);
      if (remaining.length > 0) {
        setAiOptions(remaining);
      } else {
        setAiOptions(null);
        setAiPrompt("");
      }
    } else {
      // Photo scan or single result — clear everything
      setAiResult(null);
      setAiOptions(null);
      setAiPrompt("");
      setPhotoPreview(null);
      setPhotoName("");
      setPhotoSource("");
    }
  };

  // Photo scan
  const handlePhotoSelect = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataUrl = ev.target.result;
      const base64 = dataUrl.split(",")[1];
      const mediaType = file.type || "image/jpeg";
      if (!apiKey) { alert("Please add your Anthropic API key in Settings (⚙️) to use AI features."); return; }
      setPhotoPreview(dataUrl);
      setPhotoLoading(true);
      setAiResult(null);
      try {
        const resp = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 2000,
            system: "You extract recipes from images. You respond ONLY with valid JSON, no markdown, no backticks, no explanation. All measurements must be metric (g, kg, ml, l). Small amounts can use tsp/tbsp. Convert cups to ml, oz to g, lb to g. Temperatures in celsius. Read handwriting carefully.",
            messages: [{
              role: "user",
              content: [
                { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
                { type: "text", text: `Extract the recipe. JSON format: {"name":"...","mealTag":"Dinner|Breakfast|Meal Prep|Snack|Bakery","cuisine":"Italian|Mexican|Asian|Indian|American|Mediterranean|French|Thai|Japanese|Other","difficulty":"Easy|Medium|Hard","prepTime":number,"cookTime":number,"servings":number,"ingredients":[{"name":"...","qty":number,"unit":"g|kg|ml|l|tsp|tbsp|piece|pinch|clove|can|bunch|slice|"}],"steps":["...","..."]}. If no recipe found respond: {"error":"what you see instead"}.` }
              ]
            }],
          }),
        });
        const data = await resp.json();
        if (data.error) {
          console.error("API error:", data.error);
          alert("Photo scan failed: " + (data.error.message || "Unknown error"));
          setPhotoLoading(false);
          return;
        }
        const text = (data.content || []).map(i => i.text || "").join("");
        if (!text) { alert("No response from AI. Please try again."); setPhotoLoading(false); return; }
        const clean = text.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(clean);
        if (parsed.error) {
          alert("Couldn't read a recipe from that image: " + parsed.error);
        } else {
          parsed.id = uid();
          parsed.ingredients = (parsed.ingredients || []).map(i => ({ ...i, id: uid() }));
          setAiResult(parsed);
        }
      } catch (e) {
        console.error("Photo scan error:", e);
        alert("Failed to scan the recipe. Please try again with a clearer photo.");
      }
      setPhotoLoading(false);
    };
    reader.readAsDataURL(file);
    // Reset input so same file can be selected again
    e.target.value = "";
  };

  return (
    <div className="fade-in">
      {/* AI suggestion + Photo scan */}
      <div className="ai-box">
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
          {/* Left: AI text generation */}
          <div style={{ flex: "1 1 280px" }}>
            <h3>✨ AI Recipe Suggestions</h3>
            <p style={{ fontSize: 13, opacity: 0.7, marginBottom: 12 }}>Describe what you're craving and get a full recipe generated.</p>
            <div className="ai-input-row">
              <input className="ai-input" placeholder="e.g. quick Asian noodle dish, cozy Italian soup..." value={aiPrompt} onChange={e => setAiPrompt(e.target.value)} onKeyDown={e => e.key === "Enter" && generateRecipe()} />
              <button className="btn btn-primary" onClick={generateRecipe} disabled={aiLoading || photoLoading} style={{ minWidth: 100 }}>
                {aiLoading ? <span className="spinner" /> : "Generate"}
              </button>
            </div>
          </div>

          {/* Right: Photo scan */}
          <div style={{ flex: "0 0 220px", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", borderLeft: "1px solid rgba(255,255,255,0.1)", paddingLeft: 16 }}>
            <h3 style={{ fontSize: 15, marginBottom: 6 }}>📸 Scan a Recipe</h3>
            <p style={{ fontSize: 11, opacity: 0.6, marginBottom: 10, textAlign: "center" }}>Cookbook, handwritten card, or screenshot</p>
            {/* Hidden input for camera */}
            <input
              type="file"
              accept="image/*"
              capture="environment"
              ref={photoInputRef}
              onChange={handlePhotoSelect}
              style={{ display: "none" }}
            />
            {/* Hidden input for photo library (no capture attr) */}
            <input
              type="file"
              accept="image/*"
              ref={photoLibRef}
              onChange={handlePhotoSelect}
              style={{ display: "none" }}
            />
            <div style={{ display: "flex", gap: 6, width: "100%" }}>
              <button
                className="btn btn-primary btn-sm"
                onClick={() => photoInputRef.current?.click()}
                disabled={photoLoading || aiLoading}
                style={{ flex: 1, fontSize: 12, padding: "8px 6px" }}
              >
                {photoLoading ? <span className="spinner" /> : "📷 Take Photo"}
              </button>
              <button
                className="btn btn-primary btn-sm"
                onClick={() => photoLibRef.current?.click()}
                disabled={photoLoading || aiLoading}
                style={{ flex: 1, fontSize: 12, padding: "8px 6px" }}
              >
                🖼 Library
              </button>
            </div>
          </div>
        </div>

        {/* AI 3-option picker */}
        {aiOptions && aiOptions.length > 0 && !aiResult && (
          <div style={{ marginTop: 16 }}>
            <p style={{ fontSize: 14, color: "#D4A853", fontWeight: 600, marginBottom: 10 }}>Pick one of these 3 options:</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 10 }}>
              {aiOptions.map((opt, idx) => (
                <div
                  key={opt.id}
                  onClick={() => selectAiOption(opt)}
                  style={{
                    background: "rgba(255,255,255,0.07)", borderRadius: 10, padding: 14,
                    cursor: "pointer", border: "1.5px solid rgba(255,255,255,0.1)",
                    transition: "all 0.15s",
                  }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--gold)"; e.currentTarget.style.background = "rgba(255,255,255,0.12)"; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(255,255,255,0.1)"; e.currentTarget.style.background = "rgba(255,255,255,0.07)"; }}
                >
                  <div style={{ fontSize: 11, color: "#D4A853", fontWeight: 600, marginBottom: 4 }}>Option {idx + 1}</div>
                  <h4 style={{ color: "#fff", fontSize: 15, marginBottom: 6, lineHeight: 1.3 }}>{opt.name}</h4>
                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 6 }}>
                    <span className="tag tag-cuisine" style={{ fontSize: 10 }}>{opt.cuisine}</span>
                    <span className={`tag tag-diff-${opt.difficulty}`} style={{ fontSize: 10 }}>{opt.difficulty}</span>
                  </div>
                  <div style={{ fontSize: 12, color: "#aaa", lineHeight: 1.4 }}>
                    <span>⏱ {opt.prepTime + opt.cookTime}m</span>
                    <span style={{ margin: "0 6px" }}>·</span>
                    <span>{opt.ingredients.length} ingredients</span>
                    <span style={{ margin: "0 6px" }}>·</span>
                    <span>{opt.steps.length} steps</span>
                  </div>
                </div>
              ))}
            </div>
            <button className="btn btn-outline btn-sm" style={{ color: "#ccc", borderColor: "#555", marginTop: 10 }} onClick={() => setAiOptions(null)}>Dismiss all</button>
          </div>
        )}

        {/* Photo preview + optional name/source */}
        {photoPreview && (
          <div style={{ marginTop: 12 }}>
            <div style={{ display: "flex", gap: 12, alignItems: "flex-start", marginBottom: 10 }}>
              <img src={photoPreview} alt="Recipe photo" style={{ width: 80, height: 80, objectFit: "cover", borderRadius: 8, border: "2px solid rgba(255,255,255,0.2)" }} />
              <div style={{ flex: 1 }}>
                {photoLoading && <p style={{ fontSize: 13, color: "#D4A853" }}>🔍 Reading recipe from your photo...</p>}
                {!photoLoading && aiResult && <p style={{ fontSize: 13, color: "#6BCB77" }}>✅ Recipe scanned — review below and hit <strong>Add Recipe</strong></p>}
                {!photoLoading && !aiResult && <p style={{ fontSize: 13, color: "#aaa" }}>Waiting for scan results...</p>}
              </div>
              <button className="btn btn-outline btn-sm" style={{ color: "#ccc", borderColor: "#555" }} onClick={() => { setPhotoPreview(null); setAiResult(null); setPhotoName(""); setPhotoSource(""); }}>Clear</button>
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
              <input
                className="ai-input"
                placeholder="Recipe name (optional — AI will guess if blank)"
                value={photoName}
                onChange={e => setPhotoName(e.target.value)}
                style={{ flex: "1 1 180px", fontSize: 13 }}
              />
              <input
                className="ai-input"
                placeholder="Source — e.g. RecipeTin Eats, cookbook p.12..."
                value={photoSource}
                onChange={e => setPhotoSource(e.target.value)}
                style={{ flex: "1 1 180px", fontSize: 13 }}
              />
              <button
                className="btn btn-primary btn-sm"
                onClick={saveAiRecipe}
                disabled={!aiResult || photoLoading}
                style={{ whiteSpace: "nowrap" }}
              >
                ✓ Add Recipe
              </button>
            </div>
          </div>
        )}

        {/* AI / Photo result details */}
        {aiResult && (
          <div style={{ marginTop: 12, background: "rgba(255,255,255,0.08)", borderRadius: 10, padding: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
              <div>
                <h4 style={{ color: "#fff" }}>{photoName.trim() || aiResult.name}</h4>
                {photoSource.trim() && <p style={{ fontSize: 12, color: "#D4A853", marginTop: 2 }}>📖 {photoSource}</p>}
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                <button className="btn btn-primary btn-sm" style={{ fontSize: 11 }} onClick={saveAiRecipe}>✓ Save to Recipes</button>
                <button className="btn btn-outline btn-sm" style={{ color: "#ccc", borderColor: "#555", fontSize: 11 }} onClick={() => { const r = { ...aiResult }; if (photoName.trim()) r.name = photoName.trim(); if (photoSource.trim()) r.source = photoSource.trim(); setEditing(r); setAiResult(null); setAiOptions(null); setPhotoPreview(null); setPhotoName(""); setPhotoSource(""); }}>Edit First</button>
                {aiOptions ? (
                  <button className="btn btn-outline btn-sm" style={{ color: "#ccc", borderColor: "#555", fontSize: 11 }} onClick={() => setAiResult(null)}>← Back to Options</button>
                ) : (
                  <button className="btn btn-outline btn-sm" style={{ color: "#ccc", borderColor: "#555", fontSize: 11 }} onClick={() => { setAiResult(null); setPhotoPreview(null); setPhotoName(""); setPhotoSource(""); }}>Discard</button>
                )}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, margin: "8px 0", flexWrap: "wrap" }}>
              <span className="tag tag-cuisine">{aiResult.cuisine}</span>
              <span className={`tag tag-diff-${aiResult.difficulty}`}>{aiResult.difficulty}</span>
              <span className="tag" style={{ background: "rgba(255,255,255,0.15)", color: "#ddd" }}>{aiResult.prepTime + aiResult.cookTime} min</span>
            </div>
            <p style={{ fontSize: 13, color: "#ccc", marginBottom: 4 }}><strong>Ingredients:</strong> {aiResult.ingredients.map(i => `${i.qty} ${i.unit} ${i.name}`).join(", ")}</p>
            <p style={{ fontSize: 13, color: "#ccc" }}><strong>Steps:</strong> {aiResult.steps.length} steps</p>
          </div>
        )}
      </div>

      {/* Search & filters */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
        <h2 style={{ fontSize: 24 }}>My Recipes <span style={{ fontSize: 14, color: "#8B7355", fontFamily: "'DM Sans'" }}>({recipes.length})</span></h2>
        <div style={{ display: "flex", gap: 8 }}>
          <button className={`btn btn-sm ${editMode ? "btn-danger" : "btn-outline"}`} onClick={() => { setEditMode(!editMode); setPendingDeleteId(null); }}>
            {editMode ? "✓ Done" : "🗑 Manage"}
          </button>
          <button className="btn btn-secondary btn-sm" onClick={() => setEditing(emptyRecipe())}>+ Add Recipe</button>
        </div>
      </div>
      <div className="search-bar" style={{ marginBottom: 8 }}>
        <span className="search-icon">🔍</span>
        <input className="input" style={{ paddingLeft: 38 }} placeholder="Search recipes..." value={search} onChange={e => setSearch(e.target.value)} />
      </div>
      <div className="filters">
        <select className="select" style={{ width: "auto", minWidth: 120 }} value={filterMealTag} onChange={e => setFilterMealTag(e.target.value)}>
          <option value="">All Types</option>
          {MEAL_TAGS.map(t => <option key={t} value={t}>{MEAL_TAG_STYLES[t].icon} {t}</option>)}
        </select>
        <select className="select" style={{ width: "auto", minWidth: 120 }} value={filterCuisine} onChange={e => setFilterCuisine(e.target.value)}>
          <option value="">All Cuisines</option>
          {CUISINES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select className="select" style={{ width: "auto", minWidth: 120 }} value={filterDiff} onChange={e => setFilterDiff(e.target.value)}>
          <option value="">All Difficulties</option>
          {DIFFICULTIES.map(d => <option key={d} value={d}>{d}</option>)}
        </select>
        <select className="select" style={{ width: "auto", minWidth: 130 }} value={filterTime} onChange={e => setFilterTime(e.target.value)}>
          <option value="">All Cook Times</option>
          <option value="15">⏱ Under 15 min</option>
          <option value="30">⏱ Under 30 min</option>
          <option value="45">⏱ Under 45 min</option>
          <option value="60">⏱ Under 1 hour</option>
          <option value="60+">⏱ Over 1 hour</option>
        </select>
        {(filterCuisine || filterDiff || filterMealTag || filterTime || search) && (
          <button className="btn btn-outline btn-sm" onClick={() => { setSearch(""); setFilterCuisine(""); setFilterDiff(""); setFilterMealTag(""); setFilterTime(""); }}>Clear filters</button>
        )}
      </div>

      {/* Recipe grid */}
      {editMode && (
        <div style={{ background: "#FFEBEE", borderRadius: 8, padding: "10px 14px", marginBottom: 12, fontSize: 13, color: "#C62828", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 18 }}>🗑</span>
          <span>Tap the <strong>×</strong> on any recipe to remove it from your collection. Press <strong>Done</strong> when finished.</span>
        </div>
      )}
      {filtered.length === 0 ? (
        <div style={{ textAlign: "center", padding: 60, color: "#8B7355" }}>
          <p style={{ fontSize: 40, marginBottom: 8 }}>📖</p>
          <p>{recipes.length === 0 ? "Your recipe book is empty. Add your first recipe or let AI suggest one!" : "No recipes match your filters."}</p>
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 12, marginTop: 12 }}>
          {filtered.map(r => (
            <div key={r.id} className="card" style={{ cursor: "pointer", position: "relative", opacity: pendingDeleteId === r.id ? 0.5 : 1, transition: "opacity 0.2s" }} onClick={() => !editMode && setViewing(r)}>
              {editMode && (
                pendingDeleteId === r.id ? (
                  <div style={{ position: "absolute", top: 0, right: 0, left: 0, bottom: 0, background: "rgba(231,76,60,0.95)", borderRadius: 12, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, zIndex: 5 }}
                    onClick={e => e.stopPropagation()}>
                    <p style={{ color: "#fff", fontSize: 13, fontWeight: 600 }}>Remove this recipe?</p>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button className="btn btn-sm" style={{ background: "#fff", color: "#e74c3c", fontWeight: 600 }}
                        onClick={() => { handleDelete(r.id); setPendingDeleteId(null); }}>Yes, remove</button>
                      <button className="btn btn-sm" style={{ background: "transparent", color: "#fff", border: "1px solid #fff" }}
                        onClick={() => setPendingDeleteId(null)}>Cancel</button>
                    </div>
                  </div>
                ) : (
                  <button
                    onClick={e => { e.stopPropagation(); setPendingDeleteId(r.id); }}
                    style={{
                      position: "absolute", top: 8, right: 8, width: 28, height: 28, borderRadius: "50%",
                      background: "#e74c3c", color: "#fff", border: "none", cursor: "pointer",
                      fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center",
                      boxShadow: "0 2px 6px rgba(0,0,0,0.2)", transition: "transform 0.15s",
                    }}
                    onMouseEnter={e => e.currentTarget.style.transform = "scale(1.15)"}
                    onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"}
                    title={`Remove ${r.name}`}
                  >×</button>
                )
              )}
              <h3 style={{ fontSize: 16, marginBottom: 6, paddingRight: editMode ? 32 : 0 }}>{r.name}</h3>
              {r.source && <p style={{ fontSize: 11, color: "#D4A853", marginBottom: 4 }}>📖 {r.source}</p>}
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                {r.mealTag && MEAL_TAG_STYLES[r.mealTag] && (
                  <span className="tag" style={{ background: MEAL_TAG_STYLES[r.mealTag].bg, color: MEAL_TAG_STYLES[r.mealTag].color }}>{MEAL_TAG_STYLES[r.mealTag].icon} {r.mealTag}</span>
                )}
                <span className="tag tag-cuisine">{r.cuisine}</span>
                <span className={`tag tag-diff-${r.difficulty}`}>{r.difficulty}</span>
              </div>
              <div style={{ fontSize: 12, color: "#8B7355", display: "flex", gap: 12 }}>
                <span>⏱ {r.prepTime + r.cookTime}m</span>
                <span>🍽 {r.servings} servings</span>
                <span>{r.ingredients.length} ingredients</span>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Edit modal */}
      {editing && (
        <RecipeFormModal recipe={editing} onSave={handleSave} onClose={() => setEditing(null)} />
      )}

      {/* View modal */}
      {viewing && (
        <RecipeViewModal recipe={viewing} onClose={() => setViewing(null)} onEdit={(r) => { setViewing(null); setEditing(r); }} onDelete={(id) => { setViewing(null); handleDelete(id); }} mealPlan={mealPlan} saveMealPlan={saveMealPlan} />
      )}
    </div>
  );
}

// ─── RECIPE FORM MODAL ────────────────────────────────────────
function RecipeFormModal({ recipe, onSave, onClose }) {
  const [form, setForm] = useState({ ...recipe });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const updateIng = (idx, field, val) => {
    const ings = [...form.ingredients];
    ings[idx] = { ...ings[idx], [field]: val };
    set("ingredients", ings);
  };
  const addIng = () => set("ingredients", [...form.ingredients, { id: uid(), name: "", qty: 1, unit: "" }]);
  const removeIng = (idx) => set("ingredients", form.ingredients.filter((_, i) => i !== idx));

  const updateStep = (idx, val) => { const s = [...form.steps]; s[idx] = val; set("steps", s); };
  const addStep = () => set("steps", [...form.steps, ""]);
  const removeStep = (idx) => set("steps", form.steps.filter((_, i) => i !== idx));

  const handleSubmit = () => {
    if (!form.name.trim()) { alert("Please enter a recipe name."); return; }
    onSave(form);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal fade-in" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>×</button>
        <h2 style={{ marginBottom: 16 }}>{recipe.name ? "Edit Recipe" : "New Recipe"}</h2>

        <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355", display: "block", marginBottom: 4 }}>Recipe Name</label>
        <input className="input" value={form.name} onChange={e => set("name", e.target.value)} placeholder="e.g. Spaghetti Bolognese" style={{ marginBottom: 8 }} />

        <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355", display: "block", marginBottom: 4 }}>Source <span style={{ fontWeight: 400, opacity: 0.7 }}>(optional)</span></label>
        <input className="input" value={form.source || ""} onChange={e => set("source", e.target.value)} placeholder="e.g. RecipeTin Eats, Grandma's recipe, BBC Good Food..." style={{ marginBottom: 12 }} />

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>Meal Type</label>
            <select className="select" value={form.mealTag || ""} onChange={e => set("mealTag", e.target.value)}>
              <option value="">— None —</option>
              {MEAL_TAGS.map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>Cuisine</label>
            <select className="select" value={form.cuisine} onChange={e => set("cuisine", e.target.value)}>
              {CUISINES.map(c => <option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>Difficulty</label>
            <select className="select" value={form.difficulty} onChange={e => set("difficulty", e.target.value)}>
              {DIFFICULTIES.map(d => <option key={d}>{d}</option>)}
            </select>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>Prep (min)</label>
            <input className="input" type="number" min="0" value={form.prepTime} onChange={e => set("prepTime", +e.target.value)} />
          </div>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>Cook (min)</label>
            <input className="input" type="number" min="0" value={form.cookTime} onChange={e => set("cookTime", +e.target.value)} />
          </div>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>Servings</label>
            <input className="input" type="number" min="1" value={form.servings} onChange={e => set("servings", +e.target.value)} />
          </div>
        </div>

        <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>Ingredients</label>
        <div style={{ marginBottom: 8 }}>
          {form.ingredients.map((ing, i) => (
            <div className="ing-row" key={ing.id}>
              <input className="input ing-qty" type="number" min="0" step="any" value={ing.qty} onChange={e => updateIng(i, "qty", +e.target.value)} />
              <select className="select ing-unit" value={ing.unit} onChange={e => updateIng(i, "unit", e.target.value)}>
                {UNITS.map(u => <option key={u} value={u}>{u || "—"}</option>)}
              </select>
              <input className="input ing-name" placeholder="Ingredient name" value={ing.name} onChange={e => updateIng(i, "name", e.target.value)} />
              <button className="remove-btn" onClick={() => removeIng(i)}>×</button>
            </div>
          ))}
          <button className="btn btn-outline btn-sm" onClick={addIng}>+ Ingredient</button>
        </div>

        <label style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>Steps</label>
        <div style={{ marginBottom: 12 }}>
          {form.steps.map((step, i) => (
            <div className="step-row" key={i}>
              <div className="step-num">{i + 1}</div>
              <textarea className="input" value={step} onChange={e => updateStep(i, e.target.value)} placeholder={`Step ${i + 1}...`} rows={2} style={{ flex: 1 }} />
              <button className="remove-btn" onClick={() => removeStep(i)} style={{ marginTop: 8 }}>×</button>
            </div>
          ))}
          <button className="btn btn-outline btn-sm" onClick={addStep}>+ Step</button>
        </div>

        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSubmit}>Save Recipe</button>
        </div>
      </div>
    </div>
  );
}

// ─── RECIPE VIEW MODAL ────────────────────────────────────────
function RecipeViewModal({ recipe, onClose, onEdit, onDelete, mealPlan, saveMealPlan }) {
  const [servings, setServings] = useState(recipe.servings);
  const ratio = servings / recipe.servings;
  const [confirmDel, setConfirmDel] = useState(false);
  const [showPlanner, setShowPlanner] = useState(false);
  const [planSelections, setPlanSelections] = useState({});
  const [planSaved, setPlanSaved] = useState(false);

  // BBQ Builder state
  const [selectedMeats, setSelectedMeats] = useState({});
  const [selectedSides, setSelectedSides] = useState({});

  const toggleMeat = (id) => setSelectedMeats(p => ({ ...p, [id]: !p[id] }));
  const toggleSide = (id) => setSelectedSides(p => ({ ...p, [id]: !p[id] }));

  const isBBQ = recipe.bbqBuilder;

  // Build dynamic ingredients for BBQ
  const bbqIngredients = [];
  if (isBBQ && recipe.bbqOptions) {
    recipe.bbqOptions.meats.filter(m => selectedMeats[m.id]).forEach(m => {
      bbqIngredients.push({ ...m, qty: m.perPerson ? m.qty * servings : m.qty });
    });
    recipe.bbqOptions.sides.filter(s => selectedSides[s.id]).forEach(s => {
      bbqIngredients.push({ ...s, qty: s.perPerson ? s.qty * servings : s.qty });
    });
    bbqIngredients.push({ id: "b1", name: "olive oil", qty: 2, unit: "tbsp" });
    bbqIngredients.push({ id: "b2", name: "salt and pepper", qty: 1, unit: "pinch" });
  }

  // Planner helpers
  const isWeekday = (day) => ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"].includes(day);
  const togglePlanSlot = (day, meal) => {
    const key = `${day}-${meal}`;
    setPlanSelections(p => ({ ...p, [key]: !p[key] }));
    setPlanSaved(false);
  };
  const selectedCount = Object.values(planSelections).filter(Boolean).length;

  const quickSelect = (slots) => {
    const sel = {};
    slots.forEach(s => { sel[s] = true; });
    setPlanSelections(sel);
    setPlanSaved(false);
  };

  const savePlanSelections = () => {
    const updated = { ...mealPlan };
    Object.entries(planSelections).forEach(([key, val]) => {
      if (val) updated[key] = recipe.id;
    });
    saveMealPlan(updated);
    setPlanSaved(true);
  };

  const slotTaken = (day, meal) => {
    const key = `${day}-${meal}`;
    return mealPlan && mealPlan[key] && mealPlan[key] !== recipe.id;
  };
  const slotIsThis = (day, meal) => {
    const key = `${day}-${meal}`;
    return mealPlan && mealPlan[key] === recipe.id;
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal fade-in" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>×</button>

        <div style={{ paddingRight: 40 }}>
          <h2 style={{ fontSize: 22 }}>{recipe.name}</h2>
          {recipe.source && <p style={{ fontSize: 13, color: "var(--soft-brown)", marginTop: 2 }}>📖 {recipe.source}</p>}
        </div>
        <div className="recipe-meta">
          {recipe.mealTag && MEAL_TAG_STYLES[recipe.mealTag] && (
            <span className="tag" style={{ background: MEAL_TAG_STYLES[recipe.mealTag].bg, color: MEAL_TAG_STYLES[recipe.mealTag].color }}>{MEAL_TAG_STYLES[recipe.mealTag].icon} {recipe.mealTag}</span>
          )}
          <span className="tag tag-cuisine">{recipe.cuisine}</span>
          <span className={`tag tag-diff-${recipe.difficulty}`}>{recipe.difficulty}</span>
          <span className="tag" style={{ background: "#F3E8FF", color: "#6B21A8" }}>⏱ Prep {recipe.prepTime}m</span>
          <span className="tag" style={{ background: "#FEF3C7", color: "#92400E" }}>🔥 Cook {recipe.cookTime}m</span>
        </div>

        <div className="servings-ctrl">
          <span style={{ fontSize: 13, fontWeight: 600, color: "#8B7355" }}>{isBBQ ? "People:" : "Servings:"}</span>
          <button className="servings-btn" onClick={() => setServings(Math.max(1, servings - 1))}>−</button>
          <span style={{ fontWeight: 600, minWidth: 20, textAlign: "center" }}>{servings}</span>
          <button className="servings-btn" onClick={() => setServings(servings + 1)}>+</button>
        </div>

        {/* BBQ Builder checkboxes */}
        {isBBQ && recipe.bbqOptions && (
          <div style={{ marginBottom: 16 }}>
            <h4 style={{ fontSize: 14, marginBottom: 8, color: "var(--terracotta)" }}>🥩 Choose Your Meats</h4>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
              {recipe.bbqOptions.meats.map(m => (
                <label key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", padding: "6px 10px", borderRadius: 8, background: selectedMeats[m.id] ? "#f0f7f2" : "transparent", border: selectedMeats[m.id] ? "1.5px solid var(--forest)" : "1.5px solid var(--border)", transition: "all 0.15s" }}>
                  <input type="checkbox" checked={!!selectedMeats[m.id]} onChange={() => toggleMeat(m.id)} style={{ width: 18, height: 18, accentColor: "var(--forest)" }} />
                  <span style={{ fontSize: 14, fontWeight: selectedMeats[m.id] ? 600 : 400 }}>{m.name}</span>
                  <span style={{ marginLeft: "auto", fontSize: 12, color: "#8B7355" }}>{m.qty * servings}{m.unit === "piece" ? ` ${m.unit}s` : m.unit} total</span>
                </label>
              ))}
            </div>
            <h4 style={{ fontSize: 14, marginBottom: 8, color: "var(--forest)" }}>🥗 Choose Your Sides</h4>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
              {recipe.bbqOptions.sides.map(s => (
                <label key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", padding: "6px 10px", borderRadius: 8, background: selectedSides[s.id] ? "#f0f7f2" : "transparent", border: selectedSides[s.id] ? "1.5px solid var(--forest)" : "1.5px solid var(--border)", transition: "all 0.15s" }}>
                  <input type="checkbox" checked={!!selectedSides[s.id]} onChange={() => toggleSide(s.id)} style={{ width: 18, height: 18, accentColor: "var(--forest)" }} />
                  <span style={{ fontSize: 14, fontWeight: selectedSides[s.id] ? 600 : 400 }}>{s.name}</span>
                  <span style={{ marginLeft: "auto", fontSize: 12, color: "#8B7355" }}>{s.qty * servings}{s.unit === "piece" ? ` ${s.unit}s` : s.unit} total</span>
                </label>
              ))}
            </div>

            {bbqIngredients.length > 2 && (
              <>
                <h4 style={{ fontSize: 14, marginBottom: 8 }}>🛒 Shopping List for Your BBQ</h4>
                <ul style={{ listStyle: "none", marginBottom: 16 }}>
                  {bbqIngredients.map(ing => (
                    <li key={ing.id} style={{ padding: "4px 0", fontSize: 14, borderBottom: "1px solid #f0ebe3" }}>
                      <strong>{Math.round(ing.qty * 100) / 100}</strong> {ing.unit} {ing.name}
                    </li>
                  ))}
                </ul>
              </>
            )}
          </div>
        )}

        {/* Normal ingredients (non-BBQ) */}
        {!isBBQ && (
          <>
            <h4 style={{ fontSize: 14, marginBottom: 8 }}>Ingredients</h4>
            <ul style={{ listStyle: "none", marginBottom: 16 }}>
              {recipe.ingredients.filter(i => i.name).map(ing => (
                <li key={ing.id} style={{ padding: "4px 0", fontSize: 14, borderBottom: "1px solid #f0ebe3" }}>
                  <strong>{Math.round(ing.qty * ratio * 100) / 100}</strong> {ing.unit} {ing.name}
                </li>
              ))}
            </ul>
          </>
        )}

        <h4 style={{ fontSize: 14, marginBottom: 8 }}>Instructions</h4>
        <ol style={{ paddingLeft: 20 }}>
          {recipe.steps.filter(s => s).map((step, i) => (
            <li key={i} style={{ padding: "6px 0", fontSize: 14, lineHeight: 1.5 }}>{step}</li>
          ))}
        </ol>

        {/* Add to Meal Plan */}
        <div style={{ marginTop: 20, paddingTop: 16, borderTop: "1px solid var(--border)" }}>
          {!showPlanner ? (
            <button className="btn btn-secondary btn-sm" onClick={() => setShowPlanner(true)}>📅 Add to Meal Plan</button>
          ) : (
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <h4 style={{ fontSize: 14 }}>📅 Add to Meal Plan</h4>
                <button className="btn btn-outline btn-sm" style={{ fontSize: 11 }} onClick={() => { setShowPlanner(false); setPlanSelections({}); setPlanSaved(false); }}>Close</button>
              </div>

              {/* Quick select buttons */}
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                <button className="btn btn-outline btn-sm" style={{ fontSize: 11 }} onClick={() => quickSelect(DAYS.map(d => `${d}-Dinner`))}>All Dinners</button>
                <button className="btn btn-outline btn-sm" style={{ fontSize: 11 }} onClick={() => quickSelect(DAYS.filter(isWeekday).map(d => `${d}-Lunch`))}>Weekday Lunches</button>
                <button className="btn btn-outline btn-sm" style={{ fontSize: 11 }} onClick={() => quickSelect(DAYS.map(d => `${d}-Breakfast`))}>All Breakfasts</button>
                <button className="btn btn-outline btn-sm" style={{ fontSize: 11 }} onClick={() => quickSelect(DAYS.filter(isWeekday).map(d => `${d}-Breakfast`))}>Weekday Breakfasts</button>
                <button className="btn btn-outline btn-sm" style={{ fontSize: 11 }} onClick={() => quickSelect(["Monday-Breakfast", "Wednesday-Breakfast", "Friday-Breakfast"])}>Mon/Wed/Fri Brekkie</button>
                {selectedCount > 0 && <button className="btn btn-outline btn-sm" style={{ fontSize: 11, color: "#aaa" }} onClick={() => { setPlanSelections({}); setPlanSaved(false); }}>Clear</button>}
              </div>

              {/* Day/meal grid */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 12 }}>
                {DAYS.map(day => (
                  <div key={day} style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: "var(--charcoal)", padding: "4px 0", background: "var(--warm)", borderRadius: "6px 6px 0 0" }}>{day.slice(0, 3)}</div>
                    {["Breakfast", "Lunch", "Dinner"].map(meal => {
                      if (meal === "Lunch" && !isWeekday(day)) return <div key={meal} style={{ height: 32 }} />;
                      const key = `${day}-${meal}`;
                      const selected = !!planSelections[key];
                      const taken = slotTaken(day, meal);
                      const alreadyThis = slotIsThis(day, meal);
                      return (
                        <div
                          key={meal}
                          onClick={() => !taken && !alreadyThis && togglePlanSlot(day, meal)}
                          style={{
                            fontSize: 10, padding: "6px 2px", margin: "2px 0", borderRadius: 4,
                            cursor: taken || alreadyThis ? "default" : "pointer",
                            textAlign: "center", transition: "all 0.15s", lineHeight: 1.2,
                            background: alreadyThis ? "#d4edda" : selected ? "var(--forest)" : taken ? "#f5f0eb" : "#fff",
                            color: alreadyThis ? "#2D5A3D" : selected ? "#fff" : taken ? "#ccc" : "var(--soft-brown)",
                            border: `1.5px solid ${alreadyThis ? "var(--forest)" : selected ? "var(--forest)" : "var(--border)"}`,
                          }}
                        >
                          {meal === "Breakfast" ? "Brkfst" : meal === "Lunch" ? "Lunch" : "Dinner"}
                          {alreadyThis && " ✓"}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>

              {/* Save button */}
              {selectedCount > 0 && (
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <button className="btn btn-primary btn-sm" onClick={savePlanSelections}>
                    Add to {selectedCount} slot{selectedCount > 1 ? "s" : ""}
                  </button>
                  {planSaved && <span style={{ fontSize: 13, color: "var(--forest)", fontWeight: 600 }}>✓ Added to meal plan!</span>}
                </div>
              )}
            </div>
          )}
        </div>

        {/* Action buttons at the bottom */}
        <div style={{ display: "flex", gap: 8, marginTop: 16, paddingTop: 16, borderTop: "1px solid var(--border)", alignItems: "center" }}>
          {!isBBQ && <button className="btn btn-outline btn-sm" onClick={() => onEdit(recipe)}>✏️ Edit Recipe</button>}
          {!confirmDel ? (
            <button className="btn btn-danger btn-sm" onClick={() => setConfirmDel(true)}>🗑 Delete Recipe</button>
          ) : (
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <span style={{ fontSize: 13, color: "#C62828", fontWeight: 600 }}>Are you sure?</span>
              <button className="btn btn-danger btn-sm" onClick={() => onDelete(recipe.id)}>Yes, delete</button>
              <button className="btn btn-outline btn-sm" onClick={() => setConfirmDel(false)}>Cancel</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// PLANNER TAB
// ═══════════════════════════════════════════════════════════════
function PlannerTab({ recipes, mealPlan, saveMealPlan, dayOff, saveDayOff, dayServings, saveDayServings }) {
  const [picker, setPicker] = useState(null); // { day, meal }
  const DEFAULT_SERVINGS = 5;

  const assign = (day, meal, recipeId) => {
    const key = `${day}-${meal}`;
    saveMealPlan({ ...mealPlan, [key]: recipeId });
    setPicker(null);
  };

  const clear = (day, meal) => {
    const key = `${day}-${meal}`;
    const copy = { ...mealPlan };
    delete copy[key];
    saveMealPlan(copy);
  };

  const clearAll = () => { if (confirm("Clear the entire meal plan?")) saveMealPlan({}); };

  const getRecipeName = (id) => { const r = recipes.find(r => r.id === id); return r ? r.name : "Unknown"; };

  const isWeekday = (day) => ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"].includes(day);

  const toggleDayOff = (day) => {
    saveDayOff({ ...dayOff, [day]: !dayOff[day] });
  };

  const getDayServings = (day) => dayServings[day] || DEFAULT_SERVINGS;

  const adjustServings = (day, delta) => {
    const current = getDayServings(day);
    const next = Math.max(1, current + delta);
    saveDayServings({ ...dayServings, [day]: next });
  };

  return (
    <div className="fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
        <div>
          <h2 style={{ fontSize: 24 }}>Weekly Meal Plan</h2>
          <p style={{ fontSize: 12, color: "#8B7355", marginTop: 2 }}>Toggle days off when eating out. Adjust servings per day for guests or smaller households.</p>
        </div>
        <button className="btn btn-outline btn-sm" onClick={clearAll}>Clear Week</button>
      </div>

      {recipes.length === 0 ? (
        <div style={{ textAlign: "center", padding: 40, color: "#8B7355" }}>
          <p style={{ fontSize: 36, marginBottom: 8 }}>📅</p>
          <p>Add some recipes first, then come back to plan your week!</p>
        </div>
      ) : (
        <div className="planner-grid">
          {DAYS.map(day => {
            const off = !!dayOff[day];
            const srv = getDayServings(day);
            return (
              <div key={day} className={`day-col ${off ? "day-off" : ""}`}>
                <div className={`day-header ${off ? "off" : ""}`}>
                  {day.slice(0, 3)}
                  <button
                    className={`day-off-toggle ${off ? "off" : ""}`}
                    onClick={() => toggleDayOff(day)}
                    title={off ? "Turn day back on" : "Mark as day off / eating out"}
                  />
                </div>

                {off ? (
                  <div className="day-off-banner">🍷 Out / Day Off</div>
                ) : (
                  <>
                    {/* Servings adjuster */}
                    <div className="day-servings-bar">
                      <button className="day-srv-btn" onClick={() => adjustServings(day, -1)}>−</button>
                      <span>{srv}</span>
                      <button className="day-srv-btn" onClick={() => adjustServings(day, 1)}>+</button>
                      <span style={{ fontWeight: 400, color: "#8B7355", marginLeft: 2 }}>ppl</span>
                    </div>

                    {MEAL_TYPES.map(meal => {
                      if (meal === "Lunch" && !isWeekday(day)) return null;
                      const key = `${day}-${meal}`;
                      const rid = mealPlan[key];
                      return (
                        <div key={meal} className={`meal-slot ${rid ? "filled" : ""}`} onClick={() => !rid && setPicker({ day, meal })}>
                          <div className="meal-slot-label">{meal}</div>
                          {rid ? (
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                              <span style={{ fontSize: 12, fontWeight: 500, lineHeight: 1.3 }}>{getRecipeName(rid)}</span>
                              <button className="remove-btn" style={{ fontSize: 14 }} onClick={e => { e.stopPropagation(); clear(day, meal); }}>×</button>
                            </div>
                          ) : (
                            <span style={{ fontSize: 11, color: "#bbb" }}>+ Add</span>
                          )}
                        </div>
                      );
                    })}
                  </>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Legend */}
      <div style={{ marginTop: 16, display: "flex", gap: 16, flexWrap: "wrap", fontSize: 11, color: "#8B7355" }}>
        <span>🟢 Toggle = day on</span>
        <span>🔴 Toggle = day off (excluded from shopping list)</span>
        <span>👥 Adjust people count to scale ingredients</span>
      </div>

      {/* Recipe picker modal */}
      {picker && (
        <div className="modal-overlay" onClick={() => setPicker(null)}>
          <div className="modal fade-in" style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setPicker(null)}>×</button>
            <h3 style={{ marginBottom: 4 }}>Pick a recipe</h3>
            <p style={{ fontSize: 13, color: "#8B7355", marginBottom: 12 }}>{picker.day} — {picker.meal}</p>
            <div style={{ maxHeight: 400, overflowY: "auto" }}>
              {recipes.map(r => (
                <div key={r.id} className="card" style={{ marginBottom: 8, cursor: "pointer", padding: 12 }} onClick={() => assign(picker.day, picker.meal, r.id)}>
                  <div style={{ fontWeight: 600, fontSize: 14 }}>{r.name}</div>
                  <div style={{ fontSize: 11, color: "#8B7355", marginTop: 2 }}>{r.cuisine} · {r.prepTime + r.cookTime}m · {r.difficulty}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// SHOPPING TAB
// ═══════════════════════════════════════════════════════════════
function ShoppingTab({ recipes, mealPlan, dayOff, dayServings, extraItems, saveExtraItems, checkedItems, saveCheckedItems }) {
  const [groupBy, setGroupBy] = useState("aisle");
  const [newItem, setNewItem] = useState("");
  const DEFAULT_SERVINGS = 5;

  // Build shopping list from meal plan, respecting dayOff and dayServings
  const buildList = () => {
    const items = {}; // key: normalized name, value: { name, qty, unit, recipes: [] }
    const byRecipe = {}; // recipeId-day -> { name, items, day }
    const mealPrepCounted = {}; // track meal prep recipes already counted (only count once)

    Object.entries(mealPlan).forEach(([key, recipeId]) => {
      // Parse "Monday-Dinner" -> day = "Monday"
      const dashIdx = key.indexOf("-");
      const day = key.substring(0, dashIdx);

      // Skip days that are toggled off
      if (dayOff[day]) return;

      const recipe = recipes.find(r => r.id === recipeId);
      if (!recipe) return;

      // Meal Prep recipes: only count ingredients ONCE (batch cook, portion out)
      const isMealPrep = recipe.mealTag === "Meal Prep";
      if (isMealPrep && mealPrepCounted[recipeId]) {
        // Still track it in byRecipe for display, but don't add ingredients again
        const recipeKey = `${recipeId}-${day}`;
        if (!byRecipe[recipeKey]) byRecipe[recipeKey] = { name: recipe.name, day, items: [], mealPrepDuplicate: true };
        return;
      }
      if (isMealPrep) mealPrepCounted[recipeId] = true;

      // Calculate serving ratio for this day
      const plannedServings = dayServings[day] || DEFAULT_SERVINGS;
      const ratio = isMealPrep
        ? 1 // Meal prep uses the recipe's own serving size (user decides batch size)
        : plannedServings / (recipe.servings || DEFAULT_SERVINGS);

      const recipeKey = `${recipeId}-${day}`;
      if (!byRecipe[recipeKey]) byRecipe[recipeKey] = { name: recipe.name, day, items: [] };

      // For BBQ builder recipes, use all bbqOptions as ingredients
      const ingredientList = recipe.bbqBuilder && recipe.bbqOptions
        ? [
            ...recipe.bbqOptions.meats.map(m => ({ ...m, qty: m.perPerson ? m.qty * plannedServings : m.qty })),
            ...recipe.bbqOptions.sides.map(s => ({ ...s, qty: s.perPerson ? s.qty * plannedServings : s.qty })),
            { id: "b1", name: "olive oil", qty: 2, unit: "tbsp" },
          ]
        : recipe.ingredients.filter(i => i.name.trim()).map(ing => ({ ...ing, qty: ing.qty * ratio }));

      ingredientList.forEach(ing => {
        const norm = ing.name.toLowerCase().trim();
        byRecipe[recipeKey].items.push({ name: ing.name, qty: ing.qty, unit: ing.unit });
        if (!items[norm]) items[norm] = { name: ing.name, qty: 0, unit: ing.unit, aisle: guessAisle(ing.name), recipes: [] };
        items[norm].qty += ing.qty;
        const label = isMealPrep
          ? `${recipe.name} (📦 batch)`
          : `${recipe.name} (${day.slice(0,3)})`;
        if (!items[norm].recipes.includes(label)) items[norm].recipes.push(label);
      });
    });

    return { flat: Object.values(items), byRecipe };
  };

  const { flat, byRecipe } = buildList();

  // Group by aisle
  const byAisle = {};
  AISLES.forEach(a => { byAisle[a] = []; });
  flat.forEach(item => {
    const a = item.aisle || "Other";
    if (!byAisle[a]) byAisle[a] = [];
    byAisle[a].push(item);
  });

  const toggleCheck = (key) => {
    const copy = { ...checkedItems, [key]: !checkedItems[key] };
    saveCheckedItems(copy);
  };

  const addExtra = () => {
    if (!newItem.trim()) return;
    saveExtraItems([...extraItems, { id: uid(), name: newItem.trim() }]);
    setNewItem("");
  };

  const removeExtra = (id) => saveExtraItems(extraItems.filter(i => i.id !== id));

  const totalItems = flat.length + extraItems.length;
  const checkedCount = Object.values(checkedItems).filter(Boolean).length;
  const daysOffList = DAYS.filter(d => dayOff[d]);
  const servingsNote = DAYS.filter(d => !dayOff[d] && dayServings[d] && dayServings[d] !== DEFAULT_SERVINGS);

  return (
    <div className="fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
        <h2 style={{ fontSize: 24 }}>Shopping List <span style={{ fontSize: 14, color: "#8B7355", fontFamily: "'DM Sans'" }}>({checkedCount}/{totalItems} done)</span></h2>
        <div className="toggle-wrap">
          <button className={`toggle-opt ${groupBy === "aisle" ? "active" : ""}`} onClick={() => setGroupBy("aisle")}>By Aisle</button>
          <button className={`toggle-opt ${groupBy === "recipe" ? "active" : ""}`} onClick={() => setGroupBy("recipe")}>By Recipe</button>
        </div>
      </div>

      {/* Context bar */}
      {(daysOffList.length > 0 || servingsNote.length > 0) && (
        <div style={{ background: "#FEF3C7", borderRadius: 8, padding: "8px 12px", marginBottom: 12, fontSize: 12, color: "#92400E", display: "flex", flexWrap: "wrap", gap: 12 }}>
          {daysOffList.length > 0 && (
            <span>🍷 Days off: {daysOffList.map(d => d.slice(0,3)).join(", ")} — excluded from list</span>
          )}
          {servingsNote.length > 0 && (
            <span>👥 Custom servings: {servingsNote.map(d => `${d.slice(0,3)} (${dayServings[d]}ppl)`).join(", ")}</span>
          )}
        </div>
      )}

      {flat.length === 0 && extraItems.length === 0 ? (
        <div style={{ textAlign: "center", padding: 40, color: "#8B7355" }}>
          <p style={{ fontSize: 36, marginBottom: 8 }}>🛒</p>
          <p>Your shopping list is empty. Assign recipes to your meal plan to auto-generate it!</p>
        </div>
      ) : groupBy === "aisle" ? (
        <>
          {AISLES.map(aisle => {
            const items = byAisle[aisle];
            if (!items || items.length === 0) return null;
            return (
              <div key={aisle} className="card" style={{ marginBottom: 12 }}>
                <h3 style={{ fontSize: 15, marginBottom: 8, color: "var(--forest)" }}>{aisle}</h3>
                {items.map(item => {
                  const key = `aisle-${item.name.toLowerCase()}`;
                  return (
                    <div key={key} className={`shop-item ${checkedItems[key] ? "checked" : ""}`}>
                      <input type="checkbox" className="shop-check" checked={!!checkedItems[key]} onChange={() => toggleCheck(key)} />
                      <span style={{ flex: 1, fontSize: 14 }}>
                        <strong>{Math.round(item.qty * 100) / 100} {item.unit}</strong> {item.name}
                      </span>
                      <span style={{ fontSize: 11, color: "#aaa" }}>{item.recipes.join(", ")}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </>
      ) : (
        <>
          {Object.entries(byRecipe).filter(([, data]) => !data.mealPrepDuplicate).map(([rid, data]) => (
            <div key={rid} className="card" style={{ marginBottom: 12 }}>
              <h3 style={{ fontSize: 15, marginBottom: 4, color: "var(--forest)" }}>{data.name} <span style={{ fontSize: 12, fontWeight: 400, color: "#8B7355" }}>({data.day})</span></h3>
              {data.items.length === 0 && data.mealPrepDuplicate && (
                <p style={{ fontSize: 12, color: "#8B7355", fontStyle: "italic" }}>📦 Batch cooked — ingredients counted once above</p>
              )}
              {data.items.map((item, i) => {
                const key = `recipe-${rid}-${item.name.toLowerCase()}-${i}`;
                return (
                  <div key={key} className={`shop-item ${checkedItems[key] ? "checked" : ""}`}>
                    <input type="checkbox" className="shop-check" checked={!!checkedItems[key]} onChange={() => toggleCheck(key)} />
                    <span style={{ fontSize: 14 }}><strong>{Math.round(item.qty * 100) / 100} {item.unit}</strong> {item.name}</span>
                  </div>
                );
              })}
            </div>
          ))}
        </>
      )}

      {/* Extra items */}
      <div className="card" style={{ marginTop: 16 }}>
        <h3 style={{ fontSize: 15, marginBottom: 8, color: "var(--soft-brown)" }}>🛍 Extra Items</h3>
        {extraItems.map(item => {
          const key = `extra-${item.id}`;
          return (
            <div key={item.id} className={`shop-item ${checkedItems[key] ? "checked" : ""}`}>
              <input type="checkbox" className="shop-check" checked={!!checkedItems[key]} onChange={() => toggleCheck(key)} />
              <span style={{ flex: 1, fontSize: 14 }}>{item.name}</span>
              <button className="remove-btn" onClick={() => removeExtra(item.id)}>×</button>
            </div>
          );
        })}
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <input className="input" placeholder="Add an item..." value={newItem} onChange={e => setNewItem(e.target.value)} onKeyDown={e => e.key === "Enter" && addExtra()} style={{ flex: 1 }} />
          <button className="btn btn-outline btn-sm" onClick={addExtra}>Add</button>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
